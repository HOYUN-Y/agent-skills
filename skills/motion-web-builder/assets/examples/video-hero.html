<!doctype html>
<!--
  예제: 영상 배경 히어로 (motion-patterns.md §B)

  보여 주는 것
  - 포스터(정지 대체)를 먼저 보여 주고, 재생 가능한 프레임이 생긴 뒤에만 영상으로 교차
  - play() 거부(자동재생 차단·저전력 모드)를 처리. 실패해도 포스터와 문구는 그대로
  - 사용자 일시정지 버튼. 화면 밖·백그라운드에서 멈추고, 사용자가 멈춘 경우 자동 재개하지 않음
  - 동작 감소: 영상을 불러오지 않는다 (전송 비용도 아낀다)
  - 가독성 보호막은 문구 쪽에만 깔고 피사체를 덮지 않는다

  영상 주소는 비워 두었다. data-src 에 실제 파일을 넣기 전까지는 포스터만 보이는 것이 정상이다.
  있지도 않은 파일 경로를 넣어 "영상이 있는 것처럼" 만들지 않는다.
  포스터와 영상은 같은 프레임에서 뽑아 크롭·피사체 위치를 맞춘다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남해 바래길 3코스 · 걷는 날의 기록</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../motion-tokens.css">
<style>
  :root {
    --ink: #f3efe7;
    --ink-soft: color-mix(in oklab, #f3efe7 72%, transparent);
    --sans: "Pretendard", "Noto Sans CJK KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #0e1412; color: var(--ink); font: 400 1rem/1.6 var(--sans); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .hero { position: relative; min-height: 100svh; display: grid; align-items: end; overflow: clip; isolation: isolate; }

  .media, .media > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .media { z-index: -1; }
  /* 포스터 자리. 실제 정지 이미지가 있으면 <img> 로 바꾼다. 피사체(수평선)를 화면 위 1/3 에 둔다. */
  .poster {
    background:
      linear-gradient(to bottom, #9fb3ad 0%, #c9c7b6 34%, #5d7a78 35%, #2a3b3c 70%, #172120 100%);
  }
  video { object-fit: cover; object-position: 50% 35%; opacity: 0; transition: opacity var(--sc-d-slow) var(--sc-ease-out); }
  video.ready { opacity: 1; }

  /* 보호막: 문구가 놓인 왼쪽 아래만 어둡게 */
  .scrim {
    background: radial-gradient(120% 80% at 0% 100%, rgb(8 12 11 / 0.72), transparent 62%);
  }

  .copy {
    padding: 0 clamp(1.25rem, 5vw, 5rem) clamp(2rem, 7vh, 4.5rem);
    max-width: 44rem;
  }
  .kicker { font-size: 0.8125rem; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 0.9rem; }
  h1 { margin: 0; font-weight: 600; font-size: clamp(2.2rem, 1.2rem + 4.6vw, 5.4rem); line-height: 1.06; letter-spacing: -0.035em; word-break: keep-all; }
  .copy p:last-of-type { margin: 1.1rem 0 1.6rem; color: var(--ink-soft); max-width: 32ch; word-break: keep-all; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; }
  .cta { background: var(--ink); color: #0e1412; padding: 0.8rem 1.2rem; border-radius: 2px; text-decoration: none; font-weight: 600;
         transition: transform var(--sc-d-fast) var(--sc-ease-out); }
  .cta:hover { transform: translateY(var(--sc-hover-lift)); }

  .pause {
    position: absolute; right: clamp(1rem, 3vw, 2rem); bottom: clamp(1rem, 3vw, 2rem);
    font: inherit; font-size: 0.8125rem; color: var(--ink);
    background: rgb(0 0 0 / 0.35); border: 1px solid rgb(255 255 255 / 0.35); border-radius: 999px;
    padding: 0.4rem 0.9rem; cursor: pointer; backdrop-filter: blur(6px);
  }
  .pause[hidden] { display: none; }

  @media (max-width: 640px) {
    video { object-position: 60% 35%; }
    .pause { top: 1rem; bottom: auto; }
  }
</style>
</head>
<body>
<section class="hero">
  <div class="media" aria-hidden="true">
    <div class="poster"></div>
    <video muted playsinline loop preload="none" data-src="" data-src-mobile=""></video>
    <div class="scrim"></div>
  </div>

  <div class="copy">
    <p class="kicker">남해 바래길 3코스 · 15.4km</p>
    <h1>썰물 시간에 맞춰 걷는 길</h1>
    <p>물이 빠지면 열리는 갯바위 구간이 있습니다. 오늘 간조는 오후 2시 10분, 출발은 늦어도 11시.</p>
    <div class="actions">
      <a class="cta" href="#plan">물때표와 코스 보기</a>
    </div>
  </div>

  <button class="pause" type="button" aria-pressed="false" hidden>배경 영상 멈춤</button>
</section>

<section id="plan" class="copy">
  <h2>물때표와 코스 안내</h2>
  <p>이 페이지의 시간과 코스 설명은 디자인 예시입니다. 실제 방문 전 공식 물때표와 코스 통제 여부를 확인하세요.</p>
</section>

<script>
(function () {
  const video = document.querySelector("video");
  const btn = document.querySelector(".pause");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const mobile = matchMedia("(max-width: 640px)");
  let userPaused = false;
  let inView = true;

  const src = (mobile.matches && video.dataset.srcMobile) || video.dataset.src;
  // 주소가 없으면 포스터만 표시한다. 동작 감소 중에는 sync가 영상 로드를 보류한다.
  if (!src) return;


  // 실제로 그릴 프레임이 생긴 뒤에 교차. loadeddata 만으로는 iOS에서 빈 화면일 수 있다.
  const reveal = () => {
    if (reduce.matches) return;
    video.classList.add("ready");
    btn.hidden = false;
  };
  video.addEventListener("playing", () => {
    if ("requestVideoFrameCallback" in video) video.requestVideoFrameCallback(reveal);
    else reveal();
  });

  video.addEventListener("error", () => { video.remove(); btn.remove(); }, { once: true });

  function sync() {
    const should = !userPaused && inView && !document.hidden && !reduce.matches;
    if (should && !video.getAttribute("src")) {
      video.src = src;
      video.preload = "auto";
    }
    if (should && video.paused) {
      video.play().catch(() => { /* 자동재생 거부: 포스터 유지. 버튼으로 재시도 가능 */ btn.hidden = false; });
    } else if (!should && !video.paused) {
      video.pause();
    }
  }

  btn.addEventListener("click", () => {
    userPaused = !userPaused;
    btn.setAttribute("aria-pressed", String(userPaused));
    btn.textContent = userPaused ? "배경 영상 재생" : "배경 영상 멈춤";
    sync();
  });
  new IntersectionObserver(([e]) => { inView = e.isIntersecting; sync(); }).observe(video);
  document.addEventListener("visibilitychange", sync);
  reduce.addEventListener("change", () => {
    if (reduce.matches) { video.pause(); video.classList.remove("ready"); btn.hidden = true; }
    else {
      if (video.readyState >= 2) reveal();
      sync();
    }
  });

  sync();
})();
</script>
</body>
</html>
